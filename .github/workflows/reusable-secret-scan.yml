name: Centralized Gitleaks Secret Scanning

on:
  workflow_call:
    inputs:
      fail-on-leak:
        description: 'Whether to fail the CI job if secrets are detected'
        required: false
        type: boolean
        default: true
      config-path:
        description: 'Path to custom repository .gitleaks.toml (falls back to central base)'
        required: false
        type: string
        default: ''

jobs:
  scan:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Central Base Ruleset
        run: |
          curl -sSLf "https://raw.githubusercontent.com/529-studio/.github/main/gitleaks.base.toml" -o /tmp/gitleaks.base.toml

      - name: Install Gitleaks Standalone Binary
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSLf "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Execute Secret Scan
        id: gitleaks
        shell: bash
        env:
          INPUT_CONFIG_PATH: ${{ inputs.config-path }}
          INPUT_FAIL_ON_LEAK: ${{ inputs.fail-on-leak }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          CONFIG_ARG="--config=/tmp/gitleaks.base.toml"
          if [ -n "$INPUT_CONFIG_PATH" ] && [ -f "$INPUT_CONFIG_PATH" ]; then
            CONFIG_ARG="--config=$INPUT_CONFIG_PATH"
          elif [ -f ".gitleaks.toml" ]; then
            CONFIG_ARG="--config=.gitleaks.toml"
          fi

          REPORT_ARGS="--report-format=sarif --report-path=gitleaks-report.sarif --redact"
          LEAK_EXIT_CODE=2
          EXIT_CODE=0
          LOG_OPTS=""

          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
            echo "[INFO] Scanning PR commit range: $LOG_OPTS"
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ "$PUSH_BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify "origin/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
                LOG_OPTS="origin/${DEFAULT_BRANCH}..${PUSH_HEAD_SHA}"
                echo "[INFO] New branch pushed, scanning range against $DEFAULT_BRANCH: $LOG_OPTS"
              else
                LOG_OPTS="-1 ${PUSH_HEAD_SHA}"
                echo "[INFO] Default branch ref not found, scanning HEAD commit: $LOG_OPTS"
              fi
            elif git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
              LOG_OPTS="${PUSH_BEFORE_SHA}..${PUSH_HEAD_SHA}"
              echo "[INFO] Scanning push range: $LOG_OPTS"
            else
              LOG_OPTS="-1 ${PUSH_HEAD_SHA}"
              echo "[WARN] Previous SHA not found (force-push/rebase). Scanning HEAD commit: $LOG_OPTS"
            fi
          fi

          if [ -n "$LOG_OPTS" ]; then
            gitleaks detect --log-opts="$LOG_OPTS" $CONFIG_ARG $REPORT_ARGS --exit-code=$LEAK_EXIT_CODE --verbose || EXIT_CODE=$?
          else
            echo "[INFO] Manual or scheduled trigger: Executing full repository history scan"
            gitleaks detect $CONFIG_ARG $REPORT_ARGS --exit-code=$LEAK_EXIT_CODE --verbose || EXIT_CODE=$?
          fi

          if [ "$EXIT_CODE" -eq "$LEAK_EXIT_CODE" ]; then
            echo "LEAKS_DETECTED=true" >> "$GITHUB_ENV"
            if [ "$INPUT_FAIL_ON_LEAK" = "true" ]; then
              echo "::error::[CRITICAL] Gitleaks detected unmasked secrets in commit range! Merge is blocked."
              exit 1
            else
              echo "::warning::[WARN] Gitleaks detected secrets (Audit Mode: merge is not blocked)."
              exit 0
            fi
          elif [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::[ERROR] Gitleaks failed due to a runtime or configuration error (exit code $EXIT_CODE)."
            exit "$EXIT_CODE"
          else
            echo "[OK] No secrets detected."
          fi

      - name: Upload SARIF Report to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always() && hashFiles('gitleaks-report.sarif') != ''
        with:
          sarif_file: gitleaks-report.sarif
          category: gitleaks
